name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run test --workspace=packages/clik-engine
      - run: npm run build --workspace=packages/clik-engine
      - run: npm publish --workspace=packages/clik-engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
