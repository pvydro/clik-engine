name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=packages/clik-engine

      - name: Lint
        run: npm run lint --workspace=packages/clik-engine

      - name: Test with coverage
        run: npm run test:coverage --workspace=packages/clik-engine

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/clik-engine/coverage/
          retention-days: 14

      - name: Build engine
        run: npm run build --workspace=packages/clik-engine

      - name: Build CLI
        run: npm run build --workspace=packages/create-clik-game

      - name: Check bundle size
        run: |
          BUNDLE="packages/clik-engine/dist/clik-engine.js"
          SIZE=$(wc -c < "$BUNDLE")
          echo "Bundle size: $SIZE bytes ($(( SIZE / 1024 )) KB)"

          # Fail if bundle exceeds 400KB (generous ceiling, tighten over time)
          if [ "$SIZE" -gt 409600 ]; then
            echo "::error::Bundle size $SIZE bytes exceeds 400KB limit"
            exit 1
          fi

      - name: Verify required package files
        run: |
          cd packages/clik-engine
          missing=()
          [ ! -f README.md ] && missing+=("README.md")
          [ ! -f LICENSE ] && missing+=("LICENSE")
          [ ! -f CHANGELOG.md ] && missing+=("CHANGELOG.md")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required package files: ${missing[*]}"
            exit 1
          fi
          echo "All required package files present"

      - name: Verify package.json completeness
        run: |
          cd packages/clik-engine
          node -e "
            const pkg = require('./package.json');
            const errors = [];
            if (!pkg.description) errors.push('missing description');
            if (!pkg.license) errors.push('missing license');
            if (!pkg.repository) errors.push('missing repository');
            if (!pkg.files || !pkg.files.includes('README.md')) errors.push('files must include README.md');
            if (!pkg.files || !pkg.files.includes('LICENSE')) errors.push('files must include LICENSE');
            if (!pkg.files || !pkg.files.includes('CHANGELOG.md')) errors.push('files must include CHANGELOG.md');
            if (errors.length > 0) {
              console.error('package.json validation failed:');
              errors.forEach(e => console.error('  - ' + e));
              process.exit(1);
            }
            console.log('package.json validated');
          "

      - name: Test server
        run: npm run test --workspace=packages/clik-server

      - name: Build examples
        run: |
          npm run build --workspace=examples/2048
          npm run build --workspace=examples/shooter
          npm run build --workspace=examples/cards
