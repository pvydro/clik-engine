name: Deploy Docs + Playable Games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Generate API docs
      - run: npm run docs --workspace=packages/clik-engine

      # Build example games
      - run: npm run build --workspace=examples/2048
      - run: npm run build --workspace=examples/shooter
      - run: npm run build --workspace=examples/cards
      - run: npm run build --workspace=examples/pcg-dungeon
      - run: npm run build --workspace=examples/twin-stick
      - run: npm run build --workspace=examples/boss-fight
      - run: npm run build --workspace=examples/platformer

      # Assemble site
      - name: Assemble site
        run: |
          mkdir -p _site/api _site/play/2048 _site/play/shooter _site/play/cards _site/play/pcg-dungeon _site/play/twin-stick _site/play/boss-fight _site/play/platformer
          cp docs/index.html _site/index.html
          cp -r packages/clik-engine/docs/* _site/api/
          cp -r examples/2048/dist/* _site/play/2048/
          cp -r examples/shooter/dist/* _site/play/shooter/
          cp -r examples/cards/dist/* _site/play/cards/
          cp -r examples/pcg-dungeon/dist/* _site/play/pcg-dungeon/
          cp -r examples/twin-stick/dist/* _site/play/twin-stick/
          cp -r examples/boss-fight/dist/* _site/play/boss-fight/
          cp -r examples/platformer/dist/* _site/play/platformer/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
